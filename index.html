<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enterprise Management System - Secure Administrator Login Portal">
    <title>Enterprise Portal Login | Enterprise Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass-light);
        }
        .login-brand {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-brand span {
            background: linear-gradient(135deg, var(--mzaC-accent2) 0%, var(--mzaC-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .demo-credentials {
            background: rgba(130, 160, 255, 0.1);
            border: 1px solid rgba(130, 160, 255, 0.25);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-top: 24px;
            font-size: 13px;
            color: var(--mzaC-accent2);
            text-align: center;
        }
        .readonly-user {
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.05) !important;
            cursor: not-allowed;
            border: 1px dashed rgba(255, 255, 255, 0.2) !important;
        }
    </style>
</head>
<body id="loginPage">

    <div class="login-card">
        <div class="login-brand">
            🏢 <span>EnterpriseOS</span>
        </div>
        <div class="login-subtitle">Master Multi-Module Financial Command</div>

        <form id="loginForm" onsubmit="performLogin(event)">
            <div id="loginError" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--status-danger); padding: 10px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; text-align: center;"></div>

            <div class="form-group">
                <label for="usernameInput">User Account</label>
                <input type="text" id="usernameInput" class="form-control readonly-user" value="sudhankumar" readonly required>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="Enter password (sudhan@2008@)" autofocus required>
            </div>

            <button type="submit" class="btn btn-accent btn-block" style="padding: 14px; font-size: 15px;">
                🔐 Sign In to EnterpriseOS
            </button>
        </form>

        <div class="demo-credentials">
            <strong>👤 User:</strong> <code>sudhankumar</code><br>
            Enter Password: <code>sudhan@2008@</code>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
